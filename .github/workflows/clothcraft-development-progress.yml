name: Update ClothCraft development metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [backup/exo-v2-integrated-20261101-1340]
    paths:
      - 'src/**'
      - 'integrations/**'
      - 'research/oss/clothcraft/**'
      - 'scripts/release/generate-public-development-progress.mjs'
      - 'evidence/**'
permissions:
  contents: write
concurrency:
  group: clothcraft-development-progress
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tracked EXO development snapshot
        uses: actions/checkout@v4
        with:
          ref: backup/exo-v2-integrated-20261101-1340
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate the versioned source checkpoint metric
        run: |
          EXO_SOURCE_ROOT="$GITHUB_WORKSPACE/source" EXO_PROGRESS_DEST="$RUNNER_TEMP/progress.json" node "$GITHUB_WORKSPACE/source/scripts/release/generate-public-development-progress.mjs"
      - name: Update GitHub Pages progress JSON only
        run: |
          git clone --depth=1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages
          cp "$RUNNER_TEMP/progress.json" pages/progress.json
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh ClothCraft source checkpoint coverage'
          git push origin HEAD:gh-pages
