name: ClothCraft source review
on:
  push:
    branches: [release/exo-v2-source-review-20261024]
  pull_request:
    paths: ['research/oss/clothcraft/**', '.github/workflows/clothcraft-source-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/oss/clothcraft
    steps:
      # Public, credential-free checkout avoids unrelated legacy gitlinks with
      # missing .gitmodules URLs in the parent repository.
      - name: Check out the exact public source revision
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/mikristian/exo-sample-3d.git
          git fetch --depth=1 --filter=blob:none origin "$SOURCE_REVISION"
          git sparse-checkout init --cone
          git sparse-checkout set research/oss/clothcraft
          git checkout --detach FETCH_HEAD
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build all default-feature binaries
        run: cargo +1.99.1 build --locked -j 2 --bins
      - name: CPU-only regression tests
        env:
          RAYON_NUM_THREADS: '2'
        run: cargo +1.99.1 test --locked --no-default-features -j 2 -- --test-threads=2
