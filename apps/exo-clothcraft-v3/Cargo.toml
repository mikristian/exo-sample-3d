[package]
name = "exo-clothcraft-v3"
version = "0.1.0"
edition = "2024"
description = "EXO ClothCraft Studio V3 — native Rust-first garment editor"
license = "GPL-3.0-only"

[dependencies]
marvelous-cloth = { path = "../../research/oss/clothcraft", default-features = false }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
glam = "0.34.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"

[profile.dev]
opt-level = 1
